# ============================
# 知识笔记系统 - 应用配置
# V0.1 MVP 版本
# ============================

server:
  port: 8080

spring:
  application:
    name: knowledge-note-graph

  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
      file-size-threshold: 100MB

  # Tomcat 连接器配置（防止大文件上传连接中断）
  tomcat:
    max-swallow-size: -1

  # MySQL 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_note?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

# MyBatis-Plus 配置
mybatis-plus:
  # XML Mapper 路径
  mapper-locations: classpath*:/mybatis-plus/*.xml
  # 实体包路径
  type-aliases-package: com.knowledge.note.module.*.entity
  # 全局配置
  global-config:
    db-config:
      # 主键自增
      id-type: auto
  # 控制台打印 SQL
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志级别
logging:
  level:
    com.knowledge.note: DEBUG
    com.baomidou.mybatisplus: INFO

# ============================
# LLM 大模型配置（V0.2 启用）
# 支持多模型配置，运行时通过前端切换
# ============================
llm:
  enabled: true
  default-model: deepseek
  models:
    - name: deepseek
      provider: deepseek
      api-key: sk-d9d8a70011b640e29e392d8ec67aa83e
      base-url: https://api.deepseek.com/v1
      model: deepseek-chat

# 文件上传配置
file:
  upload:
    path: ./uploads
    max-size: 1024MB

# ============================
# Embedding 嵌入模型配置（V0.2 启用）
# ============================
embedding:
  # 默认模型：bge-large-zh-v1.5，1024维
  model: bge-large-zh-v1.5
  dims: 1024
  base-url: http://localhost:8081

# ============================
# DeepSeek API 配置
# ============================
deepseek:
  api-key: sk-d9d8a70011b640e29e392d8ec67aa83e
  base-url: https://api.deepseek.com
  model: deepseek-chat

# ============================
# 火山引擎 OCR 配置
# ============================
volcano:
  ak: ${VOLCANO_AK:}
  sk: ${VOLCANO_SK:}
  region: cn-north-1
  endpoint: visual.volcengineapi.com
